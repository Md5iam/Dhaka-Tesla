services:
  - type: web
    name: dhaka-tesla-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/zones
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-1896754d-mdsiam9837-640f.f.aivencloud.com:25608/defaultdb?useSSL=false&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: static
    name: dhaka-tesla-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
